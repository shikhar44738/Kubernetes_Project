kind: Deployment
apiversion: apps/v1
metadata:
  name: mrdevops
spec:
  replicas: 2
  selector:
    matchlabels:
      app: mrdevops
    template:
      metadata:
        labels:
          app: mrdevops
      spec:
        container:
          - name: mrdevops
            image: shikhar101/pipeline-demo
            imagePullPolicy: Always
            ports:
              - containerPort: 80
