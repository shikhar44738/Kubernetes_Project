- name: Deploy application on minikube
  hosts: all
  become: true
  tasks:
    - name: Apply Deployment
      command: kubectl --kubeconfig=/home/ubuntu/.kube/config apply -f /home/ubuntu/Deployment.yml

    - name: Apply Service
      command: kubectl --kubeconfig=/home/ubuntu/.kube/config apply -f /home/ubuntu/Service.yml

    - name: Restart Deployment to pull latest image
      command: kubectl --kubeconfig=/home/ubuntu/.kube/config rollout restart deployment/mrdevops

    - name: Pause briefly for rollout to register
      pause:
        seconds: 5

    - name: Verify Deployment
      command: kubectl --kubeconfig=/home/ubuntu/.kube/config rollout status deployment/mrdevops --timeout=300s
